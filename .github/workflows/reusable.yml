name: CI/CD - Orange Pay (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20.x'
      working-directory:
        required: false
        type: string
        default: './orange-pay'

jobs:
  lint-audit-test:
    name: 🧹 Lint, 🔐 Audit & 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Run lint
        run: npm run lint || echo "::warning::Linting failed."
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: true

      - name: Security Audit
        run: npx audit-ci --moderate
        working-directory: ${{ inputs.working-directory }}

      - name: Run tests
        run: npm run test -- --coverage
        working-directory: ${{ inputs.working-directory }}

      #- name: Upload coverage report
        #uses: actions/upload-artifact@v3
        #with:
          #name: coverage-report
          #path: ${{ inputs.working-directory }}/coverage

  build-app:
    name: ⚙️ Build Vite App
    runs-on: ubuntu-latest
    needs: lint-audit-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.working-directory }}

      - name: Build project
        run: npm run build
        working-directory: ${{ inputs.working-directory }}

      - name: Upload build
        uses: actions/upload-artifact@v3
        with:
          name: vite-build
          path: ${{ inputs.working-directory }}/dist
