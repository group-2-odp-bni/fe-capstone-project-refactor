name: 📦 Pipeline Summary

on:
  workflow_call:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Download lint & audit logs
        uses: actions/download-artifact@v4
        with:
          name: lint-audit-logs
          path: ./logs

      - name: Show Summary
        run: |
          echo "📦 Pipeline Summary"
          echo "-------------------"
          echo "🧹 Lint Output:"
          cat ./logs/lint.log || echo "Lint log not found."

          echo ""
          echo "🔐 Audit Output:"
          cat ./logs/audit.log || echo "Audit log not found."
