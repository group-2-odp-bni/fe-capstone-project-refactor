name: ⚙️ Build Vite App

on:
  workflow_call:
    secrets:
      NODE_AUTH_TOKEN:
        required: false

jobs:
  build-app:
    runs-on: ubuntu-latest
    needs: lint-and-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: orange-pay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./orange-pay

      - name: Build project
        run: npm run build
        working-directory: ./orange-pay
