# .github/workflows/reusable-deploy.yml
name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      docker-image-name:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      VPS_HOST:
        required: true
      VPS_USERNAME:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: ${{ inputs.working-directory }}/dist

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Define Docker image tag
        id: docker_meta
        run: echo "tag=$(if [ "${{ inputs.environment }}" = "production" ]; then echo "latest"; else echo "${{ inputs.environment }}-$(echo ${GITHUB_SHA} | cut -c1-7)"; fi)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.working-directory }}
          push: true
          tags: ${{ inputs.docker-image-name }}:${{ steps.docker_meta.outputs.tag }}

  deploy-to-vps:
    name: 🚀 Deploy to VPS
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Mengambil image Docker terbaru dari registry
            docker pull ${{ inputs.docker-image-name }}:${{ needs.build-and-push-docker.outputs.tag }}
            
            # Menghentikan dan menghapus container yang sedang berjalan (jika ada)
            docker stop orange-pay-container || true
            docker rm orange-pay-container || true
            
            # Menjalankan container baru
            docker run -d --name orange-pay-container -p 80:80 ${{ inputs.docker-image-name }}:${{ needs.build-and-push-docker.outputs.tag }}
