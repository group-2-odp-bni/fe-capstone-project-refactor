# .github/workflows/main.yml
name: CI/CD - Orange Pay Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job untuk menjalankan CI (Lint, Audit, Build)
  ci:
    name: 🧪 Build & Test
    uses: ./.github/workflows/reusable-ci.yml
    with:
      node-version: '20.x'
      working-directory: './orange-pay'

  # Job untuk deploy ke lingkungan Staging secara otomatis
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: ci # Menunggu job 'ci' selesai
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Hanya berjalan saat push ke main
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: 'staging'
      working-directory: './orange-pay'
      docker-image-name: 'your-dockerhub-username/orange-pay'
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
      VPS_USERNAME: ${{ secrets.STAGING_VPS_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

  # Job untuk deploy ke lingkungan Production, memerlukan approval manual
  deploy-production:
    name: 🛡️ Deploy to Production
    needs: deploy-staging # Menunggu 'deploy-staging' selesai
    environment: 
      name: production # Menentukan environment 'production'
      url: https://your-app-domain.com # URL aplikasi production Anda
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: 'production'
      working-directory: './orange-pay'
      docker-image-name: 'your-dockerhub-username/orange-pay'
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
      VPS_USERNAME: ${{ secrets.PROD_VPS_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
