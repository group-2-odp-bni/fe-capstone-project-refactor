name: CI/CD - Orange Pay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-audit:
    name: 🧹 Lint & 🔐 Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: orange-pay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./orange-pay

      - name: Run lint
        run: |
          echo "Running lint..."
          npm run lint || echo "::warning::Linting failed."
        working-directory: ./orange-pay
        continue-on-error: true

      - name: Security Audit
        run: npx audit-ci --moderate
        working-directory: ./orange-pay

  build-app:
    name: ⚙️ Build Vite App
    runs-on: ubuntu-latest
    needs: lint-and-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: orange-pay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./orange-pay

      - name: Build project
        run: npm run build
        working-directory: ./orange-pay

  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build-app
    if: false  # ⛔ Skip job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t orange-pay ./orange-pay

  deploy-to-vps:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-docker
    if: false  # ⛔ Skip job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH & Deploy
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          echo "Syncing project to VPS..."
          rsync -avz -e "ssh -i key.pem" orange-pay/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/orange-pay

          echo "Running docker-compose on VPS..."
          ssh -i key.pem ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
            cd orange-pay
            docker-compose down
            docker-compose up -d --build
          EOF

  summary:
    name: 📦 Pipeline Summary
    runs-on: ubuntu-latest
    if: always()  # ✅ Tetap jalan meskipun job sebelumnya gagal atau di-skip
    needs: [lint-and-audit, build-app, build-docker, deploy-to-vps]

    steps:
      - name: Final Summary
        run: |
          echo "✅ Lint & Audit: Completed"
          echo "⚙️ Build App: Completed"
          echo "🐳 Docker Build: Skipped or Completed"
          echo "🚀 Deploy to VPS: Skipped or Completed"
