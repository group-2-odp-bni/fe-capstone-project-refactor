name: CI/CD - Orange Pay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-audit:
    name: 🧹 Lint & 🔐 Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: orange-pay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./orange-pay

      - name: Run lint
        run: |
          npm run lint > lint.log || echo "::warning::Lint failed"
        working-directory: ./orange-pay

      - name: Security Audit
        run: |
          npx audit-ci --moderate > audit.log || echo "::warning::Audit failed"
        working-directory: ./orange-pay

      - name: Upload lint & audit logs
        uses: actions/upload-artifact@v4
        with:
          name: lint-audit-logs
          path: |
            orange-pay/lint.log
            orange-pay/audit.log

  build-app:
    name: ⚙️ Build Vite App
    runs-on: ubuntu-latest
    needs: lint-and-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: orange-pay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./orange-pay

      - name: Build project
        run: npm run build
        working-directory: ./orange-pay

  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build-app
    if: false  # ⛔ Skip job for now

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t orange-pay ./orange-pay

  deploy-to-vps:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-docker
    if: false  # ⛔ Skip job for now

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH & Deploy
        run: echo "Deploy skipped for now."

  summary:
    name: 📦 Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-and-audit, build-app, build-docker, deploy-to-vps]

    steps:
      - name: Download lint & audit logs
        uses: actions/download-artifact@v4
        with:
          name: lint-audit-logs
          path: ./logs

      - name: Show Summary
        run: |
          echo "📦 Pipeline Summary"
          echo "-------------------"
          echo "🧹 Lint Output:"
          cat ./logs/lint.log || echo "Lint log not found."

          echo ""
          echo "🔐 Audit Output:"
          cat ./logs/audit.log || echo "Audit log not found."

          echo ""
          echo "⚙️ Build App: ${{ needs.build-app.result }}"
          echo "🐳 Docker Build: ${{ needs.build-docker.result }}"
          echo "🚀 Deploy to VPS: ${{ needs.deploy-to-vps.result }}"
