name: 🚦 CI/CD - Orange Pay (Main Workflow)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-audit:
    uses: ./.github/workflows/lint-and-audit.yml

  build-app:
    uses: ./.github/workflows/build-app.yml
    needs: lint-and-audit

  summary:
    uses: ./.github/workflows/summary.yml
    needs: [lint-and-audit, build-app]
