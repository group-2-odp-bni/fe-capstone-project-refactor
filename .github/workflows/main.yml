name: CI/CD - Orange Pay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci_pipeline:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: orange-pay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./orange-pay

      - name: Run lint
        run: npm run lint
        working-directory: ./orange-pay

      - name: Security Audit
        run: npx audit-ci --moderate
        working-directory: ./orange-pay

      #- name: Run tests
        #run: npm run test -- --coverage

      - name: Build project
        run: npm run build
        working-directory: ./orange-pay

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: ./dist

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
