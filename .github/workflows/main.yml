name: CI/CD - Orange Pay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: orange-pay/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./orange-pay

      - name: Run lint
        run: |
          echo "Running lint..."
          npm run lint || echo "::warning::Linting failed. See output."
        working-directory: ./orange-pay
        continue-on-error: true

      - name: Security Audit
        run: npx audit-ci --moderate
        working-directory: ./orange-pay

