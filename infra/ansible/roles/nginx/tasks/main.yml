- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: no

- name: Deploy Nginx config
  template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/fe_site.conf

- name: Enable site
  file:
    src: /etc/nginx/sites-available/fe_site.conf
    dest: /etc/nginx/sites-enabled/fe_site.conf
    state: link
    force: true

- name: Remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Reload Nginx
  systemd:
    name: nginx
    state: restarted
    enabled: true
