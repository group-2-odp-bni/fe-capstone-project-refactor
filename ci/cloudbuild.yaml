substitutions:
  _FE_VM_NAME: "fe-web-01"
  _FE_VM_ZONE: "us-central1-c"
  _SSH_USER: "web"
  _PURGE_CF: "true"
  _CF_ZONE_ID: "<ISI_ZONE_ID_KAMU>"
  _DOMAIN_NAME: "app.orangebybni.my.id"
  _CF_TOKEN_SECRET: "cf-api-token"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_CF_TOKEN_SECRET}/versions/latest
      env: "CF_API_TOKEN"

steps:
  - name: "node:20"
    id: build-fe
    entrypoint: bash
    args:
      - -ceu
      - |
        cd orange-pay
        rm -rf node_modules
        echo ">>> Debug npm/node"
        node -v
        npm -v
        echo "omit=$(npm config get omit) ignore-optional=$(npm config get ignore-optional)"
        [ -f .npmrc ] && (echo ">>> .npmrc:"; cat .npmrc) || true
        env | grep -Ei 'NPM_CONFIG_(OMIT|IGNORE_OPTIONAL)' || true
        npm ci --include=optional || npm ci
        echo ">>> Installing Linux-safe bindings for native modules..."
        npm i -D @rollup/rollup-linux-x64-gnu || true
        npm i -D @swc/core-linux-x64-gnu || true
        npm i -D lightningcss@npm:lightningcss-wasm@^1.30.1
        npm i -D lightningcss-linux-x64-gnu lightningcss-wasm
        export LIGHTNINGCSS_USE_WASM=1
        export ROLLUP_DISABLE_NATIVE=1
        export ROLLUP_USE_NATIVE=false
        npm rebuild esbuild || true
        export LIGHTNINGCSS_USE_WASM=1
        export NODE_OPTIONS="--no-experimental-fetch"
        echo ">>> Attempt 1: Build dengan konfigurasi asli"
        if npx vite build --mode production; then
          echo ">>> Build berhasil dengan konfigurasi asli"
        else
          echo ">>> Attempt 2: Reinstall @tailwindcss/postcss dan rebuild"
          npm i -D @tailwindcss/postcss@latest
          npx vite build --mode production
        fi

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    waitFor: ["build-fe"]
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euo pipefail
        VM_NAME="${_FE_VM_NAME}"
        VM_ZONE="${_FE_VM_ZONE}"
        DEPLOY_TIMESTAMP="$(date +%s)"
        RELEASE_DIR="/var/www/app/releases/$${DEPLOY_TIMESTAMP}"

        echo ">>> Arsipkan artefak build"
        tar -C orange-pay/dist -czf /workspace/dist.tgz .

        echo ">>> Upload via IAP (tanpa SSH key & tanpa port 22 publik)"
        gcloud compute scp /workspace/dist.tgz "${_SSH_USER}@$${VM_NAME}:/tmp/dist.tgz" \
          --zone="$${VM_ZONE}" --tunnel-through-iap

        echo ">>> Ekstrak & switch symlink di VM"
        gcloud compute ssh "${_SSH_USER}@$${VM_NAME}" --zone="$${VM_ZONE}" --tunnel-through-iap --command "
          set -euo pipefail
          sudo mkdir -p $${RELEASE_DIR}
          sudo tar -C $${RELEASE_DIR} -xzf /tmp/dist.tgz
          sudo chown -R ${_SSH_USER}:${_SSH_USER} $${RELEASE_DIR} || true
          sudo ln -sfn $${RELEASE_DIR} /var/www/app/current
          sudo systemctl reload nginx || sudo systemctl reload caddy || true
        "
  - name: "curlimages/curl"
    id: purge-cf
    waitFor: ["deploy"]
    entrypoint: bash
    secretEnv: ["CF_API_TOKEN"]
    args:
      - -ceu
      - |
        if [ "${_PURGE_CF}" = "true" ] && [ -n "${_CF_ZONE_ID}" ] && [ "${_CF_ZONE_ID}" != "<ISI_ZONE_ID_KAMU>" ]; then
          echo ">>> Purging Cloudflare cache for zone ${_CF_ZONE_ID}"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${_CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $$CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo ">>> Cloudflare cache purged successfully"
        else
          echo ">>> Skip Cloudflare purge (PURGE_CF=${_PURGE_CF}, CF_ZONE_ID=${_CF_ZONE_ID})"
        fi

timeout: 1200s
