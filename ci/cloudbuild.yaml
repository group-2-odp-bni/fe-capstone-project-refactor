substitutions:
  _FE_VM_IP: "34.58.80.35"
  _SSH_USER: "web"
  _PURGE_CF: "true"
  _CF_ZONE_ID: "<ISI_ZONE_ID_KAMU>"
  _DOMAIN_NAME: "app.orangebybni.my.id"
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: "node:20"
    id: build-fe
    entrypoint: bash
    args:
      - -ceu
      - |
        cd orange-pay
        npm ci
        npm run build

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update -qq && apt-get install -y rsync openssh-client

        printf '%s' "$$SSH_KEY" > /tmp/id_ed25519
        chmod 600 /tmp/id_ed25519

        TIMESTAMP="$(date +%s)"
        RELEASE_DIR="/var/www/app/releases/${TIMESTAMP}"

        echo ">>> create release dir: $RELEASE_DIR"
        ssh -i /tmp/id_ed25519 -o StrictHostKeyChecking=no ${_SSH_USER}@${_FE_VM_IP} \
          "mkdir -p $RELEASE_DIR && chown -R ${_SSH_USER}:${_SSH_USER} /var/www/app"

        echo ">>> upload artefacts"
        rsync -avz --delete \
          -e "ssh -i /tmp/id_ed25519 -o StrictHostKeyChecking=no" \
          orange-pay/dist/ ${_SSH_USER}@${_FE_VM_IP}:${RELEASE_DIR}/

        echo ">>> switch symlink & reload nginx"
        ssh -i /tmp/id_ed25519 -o StrictHostKeyChecking=no ${_SSH_USER}@${_FE_VM_IP} \
          "ln -sfn ${RELEASE_DIR} /var/www/app/current && sudo systemctl reload nginx"

  - name: "curlimages/curl"
    id: purge-cf
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_PURGE_CF}" = "true" ] && [ -n "${_CF_ZONE_ID}" ]; then
          echo ">>> Purging Cloudflare cache for zone ${_CF_ZONE_ID}"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${_CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        else
          echo ">>> Skip purge (PURGE_CF=${_PURGE_CF}, CF_ZONE_ID='${_CF_ZONE_ID}')"
        fi

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/fe-ssh-private-key/versions/latest
      env: SSH_KEY
    - versionName: projects/${PROJECT_ID}/secrets/cf-api-token/versions/latest
      env: CF_API_TOKEN

timeout: 1200s
