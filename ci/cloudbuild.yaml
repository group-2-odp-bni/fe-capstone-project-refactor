substitutions:
  _FE_VM_IP: "34.58.80.35"
  _SSH_USER: "web"
  _PURGE_CF: "true"
  _CF_ZONE_ID: "<ISI_ZONE_ID_KAMU>"
  _DOMAIN_NAME: "app.orangebybni.my.id"
  _SSH_KEY_SECRET: "fe-ssh-private-key"
  _CF_TOKEN_SECRET: "cf-api-token"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_SSH_KEY_SECRET}/versions/latest
      env: "SSH_KEY"
    - versionName: projects/$PROJECT_ID/secrets/${_CF_TOKEN_SECRET}/versions/latest
      env: "CF_API_TOKEN"

steps:
  - name: "node:20"
    id: build-fe
    entrypoint: bash
    args:
      - -ceu
      - |
        cd orange-pay
        rm -rf node_modules package-lock.json
        npm ci --no-optional
        npx vite build --mode production

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    waitFor: ["build-fe"]
    entrypoint: bash
    secretEnv: ["SSH_KEY"]
    args:
      - -ceu
      - |
        apt-get update -qq && apt-get install -y rsync openssh-client

        echo ">>> Setting up SSH key from secret"
        echo "$$SSH_KEY" > /tmp/id_ed25519
        chmod 600 /tmp/id_ed25519

        DEPLOY_TIMESTAMP="$(date +%s)"
        RELEASE_DIR="/var/www/app/releases/$${DEPLOY_TIMESTAMP}"

        echo ">>> Create release directory: $${RELEASE_DIR}"

        ssh -i /tmp/id_ed25519 -o StrictHostKeyChecking=no "${_SSH_USER}@${_FE_VM_IP}" \
          "mkdir -p $${RELEASE_DIR} && chown -R ${_SSH_USER}:${_SSH_USER} /var/www/app"

        echo ">>> Upload artefacts to VM"
        rsync -avz --delete \
          -e "ssh -i /tmp/id_ed25519 -o StrictHostKeyChecking=no" \
          orange-pay/dist/ "${_SSH_USER}@${_FE_VM_IP}:$${RELEASE_DIR}/"

        echo ">>> Switch symlink and reload nginx"
        ssh -i /tmp/id_ed25519 -o StrictHostKeyChecking=no "${_SSH_USER}@${_FE_VM_IP}" \
          "ln -sfn $${RELEASE_DIR} /var/www/app/current && sudo systemctl reload nginx"

        echo ">>> Cleanup SSH key"
        rm -f /tmp/id_ed25519

  - name: "curlimages/curl"
    id: purge-cf
    waitFor: ["deploy"]
    entrypoint: bash
    secretEnv: ["CF_API_TOKEN"]
    args:
      - -ceu
      - |
        if [ "${_PURGE_CF}" = "true" ] && [ -n "${_CF_ZONE_ID}" ] && [ "${_CF_ZONE_ID}" != "<ISI_ZONE_ID_KAMU>" ]; then
          echo ">>> Purging Cloudflare cache for zone ${_CF_ZONE_ID}"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${_CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $$CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo ">>> Cloudflare cache purged successfully"
        else
          echo ">>> Skip Cloudflare purge (PURGE_CF=${_PURGE_CF}, CF_ZONE_ID=${_CF_ZONE_ID})"
        fi

timeout: 1200s
